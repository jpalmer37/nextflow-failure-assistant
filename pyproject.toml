[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nextflow-failure-assistant"
version = "0.1.0"
description = "Diagnose a failed Nextflow run from its log, and measure whether that beats grep."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.10,<3",
]

[project.optional-dependencies]
sdk = ["anthropic>=0.40"]
dev = ["pytest>=8.3,<9"]

[tool.setuptools.packages.find]
include = ["nfdx*"]
